<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>폰브라운 가격 추적기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a24;
      --bg-card-hover: #22222e;
      --text-primary: #ffffff;
      --text-secondary: #a0a0b0;
      --text-muted: #606070;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.3);
      --skt: #e42c2c;
      --kt: #000000;
      --lgu: #e91e8c;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: rgba(255, 255, 255, 0.08);
      --border-light: rgba(255, 255, 255, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
    }

    .header {
      background: linear-gradient(180deg, var(--bg-secondary) 0%, transparent 100%);
      padding: 24px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .logo-text { font-size: 20px; font-weight: 700; }

    .logo-badge {
      font-size: 10px;
      background: var(--accent);
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
    }

    .last-updated { font-size: 13px; color: var(--text-muted); }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* 기종 선택 */
    .model-section { margin-top: 32px; }

    .model-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }

    .model-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .model-card:hover {
      background: var(--bg-card-hover);
      transform: translateY(-2px);
    }

    .model-card.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(139, 92, 246, 0.15) 100%);
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .model-name { font-size: 14px; font-weight: 600; margin-bottom: 6px; }

    .model-price { font-size: 12px; color: var(--text-secondary); }
    .model-price .good { color: var(--success); font-weight: 600; }
    .model-price .bad { color: var(--danger); font-weight: 600; }

    /* 필터 */
    .filter-bar {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      background: var(--bg-card);
      border-radius: 10px;
      padding: 4px;
      border: 1px solid var(--border);
    }

    .filter-btn {
      padding: 8px 16px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .filter-btn:hover { color: var(--text-primary); }
    .filter-btn.active { background: var(--accent); color: white; }

    .filter-btn.skt.active { background: var(--skt); }
    .filter-btn.kt.active { background: #333; }
    .filter-btn.lgu.active { background: var(--lgu); }

    /* 차트 */
    .chart-section { margin-top: 24px; }

    .chart-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .chart-title { font-size: 18px; font-weight: 700; }
    .chart-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

    .price-summary { text-align: right; }

    .current-price {
      font-size: 28px;
      font-weight: 800;
    }
    .current-price.negative {
      background: linear-gradient(135deg, var(--success) 0%, #4ade80 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .current-price.positive {
      color: var(--text-primary);
    }

    .price-change { font-size: 13px; margin-top: 4px; }
    .price-change.up { color: var(--danger); }
    .price-change.down { color: var(--success); }

    .chart-container { position: relative; height: 280px; }

    /* 가격 테이블 */
    .price-section { margin-top: 32px; }

    .price-table {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .price-row {
      display: grid;
      grid-template-columns: 80px 1fr 1fr 1fr;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      align-items: center;
      gap: 12px;
    }

    .price-row:last-child { border-bottom: none; }
    .price-row:hover { background: var(--bg-card-hover); }

    .price-row-header {
      background: var(--bg-secondary);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .price-row-header:hover { background: var(--bg-secondary); }

    .carrier-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 13px;
    }

    .carrier-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .carrier-dot.skt { background: var(--skt); }
    .carrier-dot.kt { background: #666; }
    .carrier-dot.lgu { background: var(--lgu); }

    .price-cell {
      text-align: center;
    }

    .price-value {
      font-weight: 700;
      font-size: 15px;
    }
    .price-value.negative { color: var(--success); }
    .price-value.positive { color: var(--text-primary); }

    .price-label {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* 인사이트 */
    .insight-box {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.1) 0%, rgba(34, 197, 94, 0.05) 100%);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 12px;
      padding: 16px 20px;
      margin-top: 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .insight-box.warning {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.1) 0%, rgba(245, 158, 11, 0.05) 100%);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .insight-icon { font-size: 20px; }
    .insight-content { flex: 1; }
    .insight-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .insight-text { font-size: 13px; color: var(--text-secondary); }

    /* 푸터 */
    .footer {
      margin-top: 48px;
      padding: 24px 0;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
    }
    .footer a { color: var(--accent); text-decoration: none; }

    /* 로딩 */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      color: var(--text-muted);
    }

    /* 날짜 선택 */
    .date-select {
      padding: 8px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      outline: none;
    }
    .date-select:focus {
      border-color: var(--accent);
    }

    @media (max-width: 768px) {
      .header-inner { flex-direction: column; gap: 12px; }
      .filter-bar { flex-direction: column; }
      .filter-group { width: 100%; justify-content: center; }
      .price-row { grid-template-columns: 60px 1fr 1fr; font-size: 13px; }
      .chart-header { flex-direction: column; }
      .price-summary { text-align: left; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">📱</div>
        <span class="logo-text">폰브라운 가격 추적기</span>
        <span class="logo-badge">BETA</span>
      </div>
      <div class="last-updated" id="lastUpdated">데이터 로딩 중...</div>
    </div>
  </header>

  <main class="container">
    <!-- 기종 선택 -->
    <section class="model-section">
      <h2 class="section-title">📱 기종 선택</h2>
      <div class="model-grid" id="modelGrid">
        <div class="loading">로딩 중...</div>
      </div>
    </section>

    <!-- 필터 -->
    <div class="filter-bar">
      <div class="filter-group" id="typeFilter">
        <button class="filter-btn active" data-type="이동">이동</button>
        <button class="filter-btn" data-type="기변">기변</button>
      </div>
      <div class="filter-group" id="carrierFilter">
        <button class="filter-btn skt active" data-carrier="SKT">SKT</button>
        <button class="filter-btn kt" data-carrier="KT">KT</button>
        <button class="filter-btn lgu" data-carrier="LGU+">LG U+</button>
      </div>
      <div class="filter-group" id="periodFilter">
        <button class="filter-btn active" data-period="7">1주</button>
        <button class="filter-btn" data-period="30">1달</button>
        <button class="filter-btn" data-period="all">전체</button>
      </div>
    </div>

    <!-- 차트 -->
    <section class="chart-section">
      <div class="chart-card">
        <div class="chart-header">
          <div>
            <h3 class="chart-title" id="chartTitle">기종을 선택하세요</h3>
            <p class="chart-subtitle" id="chartSubtitle">-</p>
          </div>
          <div class="price-summary">
            <div class="current-price" id="currentPrice">-</div>
            <div class="price-change" id="priceChange"></div>
          </div>
        </div>
        <div class="chart-container">
          <canvas id="priceChart"></canvas>
        </div>
        <div id="insightBox"></div>
      </div>
    </section>

    <!-- 오늘의 가격 테이블 -->
    <section class="price-section">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
        <h2 class="section-title" style="margin-bottom:0;">💰 가격표</h2>
        <select id="dateSelect" class="date-select">
          <option value="">날짜 선택</option>
        </select>
      </div>
      <div class="price-table" id="priceTable">
        <div class="price-row price-row-header">
          <div>통신사</div>
          <div style="text-align:center">이동</div>
          <div style="text-align:center">기변</div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <p>데이터 출처: <a href="https://pf.kakao.com/_xoLhxcs" target="_blank">폰브라운 카카오톡 채널</a></p>
      <p style="margin-top: 6px;">이 페이지는 개인 용도로 제작되었습니다. 매일 자동 업데이트.</p>
    </footer>
  </main>

  <script>
    // 상태
    let priceData = { history: [] };
    let selectedModel = null;
    let selectedType = '이동';
    let selectedCarrier = 'SKT';
    let selectedPeriod = 7;
    let selectedDate = null;
    let chart = null;

    const carrierColors = {
      'SKT': '#e42c2c',
      'KT': '#666666',
      'LGU+': '#e91e8c'
    };

    // 가격 포맷
    function formatPrice(price) {
      if (price === null || price === undefined) return '-';
      const absPrice = Math.abs(price);
      const formatted = absPrice >= 10000 
        ? (absPrice / 10000).toFixed(absPrice % 10000 === 0 ? 0 : 1) + '만'
        : absPrice.toLocaleString();
      return (price < 0 ? '-' : '') + formatted + '원';
    }

    // 데이터 로드
    async function loadData() {
      try {
        const res = await fetch('data/prices.json');
        priceData = await res.json();
        
        if (priceData.lastUpdated) {
          const d = new Date(priceData.lastUpdated);
          document.getElementById('lastUpdated').textContent = 
            `업데이트: ${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
        }
        
        renderModels();
      } catch (e) {
        console.error(e);
        document.getElementById('modelGrid').innerHTML = 
          '<p style="color:var(--text-muted);padding:40px;text-align:center;">데이터를 불러올 수 없습니다.</p>';
      }
    }

    // 모델 목록
    function renderModels() {
      const models = [...new Set(priceData.history.map(i => i.model))];
      const grid = document.getElementById('modelGrid');
      
      if (!models.length) {
        grid.innerHTML = '<p style="color:var(--text-muted)">데이터 없음</p>';
        return;
      }

      grid.innerHTML = models.map(model => {
        // 해당 모델의 이동 최저가 찾기
        const prices = priceData.history.filter(i => i.model === model && i.type === '이동');
        const minPrice = prices.length ? Math.min(...prices.map(p => p.price)) : null;
        
        let priceHtml = '';
        if (minPrice !== null) {
          const cls = minPrice < 0 ? 'good' : 'bad';
          priceHtml = `이동 최저 <span class="${cls}">${formatPrice(minPrice)}</span>`;
        }
        
        return `
          <div class="model-card ${selectedModel === model ? 'active' : ''}" data-model="${model}">
            <div class="model-name">${model}</div>
            <div class="model-price">${priceHtml || '가격 정보 없음'}</div>
          </div>
        `;
      }).join('');

      grid.querySelectorAll('.model-card').forEach(card => {
        card.onclick = () => {
          selectedModel = card.dataset.model;
          renderModels();
          updateChart();
          updateTable();
        };
      });

      // 첫 모델 자동 선택
      if (!selectedModel && models.length) {
        selectedModel = models[0];
        renderModels();
        updateDateSelect();
        updateChart();
        updateTable();
      }
    }

    // 날짜 선택 드롭다운 업데이트
    function updateDateSelect() {
      const allDates = [...new Set(priceData.history.map(i => i.date))].sort().reverse();
      const select = document.getElementById('dateSelect');
      
      select.innerHTML = allDates.map(date => {
        const d = new Date(date);
        const label = (d.getMonth() + 1) + '/' + d.getDate();
        return '<option value="' + date + '">' + label + '</option>';
      }).join('');
      
      // 최신 날짜 자동 선택
      if (!selectedDate && allDates.length) {
        selectedDate = allDates[0];
      }
      select.value = selectedDate;
    }

    // 차트 업데이트
    function updateChart() {
      if (!selectedModel) return;

      let data = priceData.history.filter(i => i.model === selectedModel && i.type === selectedType);
      
      if (selectedCarrier !== 'all') {
        data = data.filter(i => i.carrier === selectedCarrier);
      }

      if (selectedPeriod !== 'all') {
        const cutoff = new Date();
        cutoff.setDate(cutoff.getDate() - selectedPeriod);
        data = data.filter(i => new Date(i.date) >= cutoff);
      }

      // 날짜별 최저가
      const byDate = {};
      data.forEach(i => {
        if (!byDate[i.date] || i.price < byDate[i.date]) {
          byDate[i.date] = i.price;
        }
      });

      const dates = Object.keys(byDate).sort();
      const prices = dates.map(d => byDate[d]);

      // 헤더 업데이트
      document.getElementById('chartTitle').textContent = selectedModel;
      document.getElementById('chartSubtitle').textContent = 
        `${selectedType} | ${selectedCarrier === 'all' ? '전체 통신사' : selectedCarrier}`;

      if (prices.length) {
        const current = prices[prices.length - 1];
        const priceEl = document.getElementById('currentPrice');
        priceEl.textContent = formatPrice(current);
        priceEl.className = 'current-price ' + (current < 0 ? 'negative' : 'positive');

        // 인사이트
        const min = Math.min(...prices);
        const max = Math.max(...prices);
        const insightBox = document.getElementById('insightBox');
        
        if (current <= min) {
          insightBox.innerHTML = `
            <div class="insight-box">
              <div class="insight-icon">🎉</div>
              <div class="insight-content">
                <div class="insight-title">지금이 최저가!</div>
                <div class="insight-text">추적 기간 중 가장 저렴한 시점이에요. 구매를 고려해보세요.</div>
              </div>
            </div>
          `;
        } else if (current >= max) {
          insightBox.innerHTML = `
            <div class="insight-box warning">
              <div class="insight-icon">⚠️</div>
              <div class="insight-content">
                <div class="insight-title">지금은 비싼 편</div>
                <div class="insight-text">추적 기간 중 가장 비싼 시점이에요. 조금 더 기다려보세요.</div>
              </div>
            </div>
          `;
        } else {
          insightBox.innerHTML = '';
        }
      } else {
        document.getElementById('currentPrice').textContent = '-';
        document.getElementById('insightBox').innerHTML = '';
      }

      // 차트 그리기
      const ctx = document.getElementById('priceChart').getContext('2d');
      if (chart) chart.destroy();

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: dates.map(d => {
            const dt = new Date(d);
            return `${dt.getMonth()+1}/${dt.getDate()}`;
          }),
          datasets: [{
            label: '최저가',
            data: prices,
            borderColor: carrierColors[selectedCarrier],
            backgroundColor: carrierColors[selectedCarrier] + '20',
            borderWidth: 3,
            fill: true,
            tension: 0.3,
            pointRadius: 5,
            pointBackgroundColor: carrierColors[selectedCarrier],
            pointBorderColor: '#fff',
            pointBorderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#1a1a24',
              padding: 12,
              callbacks: {
                label: ctx => formatPrice(ctx.raw)
              }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(255,255,255,0.05)' },
              ticks: { color: '#606070' }
            },
            y: {
              grid: { color: 'rgba(255,255,255,0.05)' },
              ticks: {
                color: '#606070',
                callback: v => formatPrice(v)
              }
            }
          }
        }
      });
    }

    // 테이블 업데이트
    function updateTable() {
      if (!selectedModel) return;

      const table = document.getElementById('priceTable');
      const modelData = priceData.history.filter(i => i.model === selectedModel);
      
      if (!modelData.length) {
        table.innerHTML = `
          <div class="price-row price-row-header">
            <div>통신사</div>
            <div style="text-align:center">이동</div>
            <div style="text-align:center">기변</div>
          </div>
          <div class="price-row">
            <div style="grid-column:1/-1;text-align:center;color:var(--text-muted)">데이터 없음</div>
          </div>
        `;
        return;
      }

      // 선택된 날짜 또는 최신 날짜 사용
      const dates = [...new Set(modelData.map(i => i.date))].sort();
      const targetDate = selectedDate || dates[dates.length - 1];
      const dayData = modelData.filter(i => i.date === targetDate);

      // 통신사별 정리
      const carriers = ['SKT', 'KT', 'LGU+'];
      let rows = `
        <div class="price-row price-row-header">
          <div>통신사</div>
          <div style="text-align:center">이동</div>
          <div style="text-align:center">기변</div>
        </div>
      `;

      carriers.forEach(carrier => {
        const 이동 = dayData.find(i => i.carrier === carrier && i.type === '이동');
        const 기변 = dayData.find(i => i.carrier === carrier && i.type === '기변');
        
        if (!이동 && !기변) return;

        const carrierClass = carrier === 'SKT' ? 'skt' : carrier === 'KT' ? 'kt' : 'lgu';
        
        const 이동Price = 이동 ? 이동.price : null;
        const 기변Price = 기변 ? 기변.price : null;

        rows += `
          <div class="price-row">
            <div class="carrier-badge">
              <span class="carrier-dot ${carrierClass}"></span>
              ${carrier}
            </div>
            <div class="price-cell">
              <div class="price-value ${이동Price < 0 ? 'negative' : 'positive'}">${formatPrice(이동Price)}</div>
            </div>
            <div class="price-cell">
              <div class="price-value ${기변Price < 0 ? 'negative' : 'positive'}">${formatPrice(기변Price)}</div>
            </div>
          </div>
        `;
      });

      table.innerHTML = rows;
    }

    // 필터 이벤트
    function setupFilters() {
      document.getElementById('typeFilter').onclick = e => {
        if (!e.target.classList.contains('filter-btn')) return;
        document.querySelectorAll('#typeFilter .filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        selectedType = e.target.dataset.type;
        updateChart();
      };

      document.getElementById('carrierFilter').onclick = e => {
        if (!e.target.classList.contains('filter-btn')) return;
        document.querySelectorAll('#carrierFilter .filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        selectedCarrier = e.target.dataset.carrier;
        updateChart();
      };

      document.getElementById('periodFilter').onclick = e => {
        if (!e.target.classList.contains('filter-btn')) return;
        document.querySelectorAll('#periodFilter .filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        selectedPeriod = e.target.dataset.period === 'all' ? 'all' : parseInt(e.target.dataset.period);
        updateChart();
      };

      document.getElementById('dateSelect').onchange = e => {
        selectedDate = e.target.value;
        updateTable();
      };
    }

    // 초기화
    loadData();
    setupFilters();
  </script>
</body>
</html>
